<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos del Mundo | cafes.uy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================
           DESIGN SYSTEM - cafes.uy
           ============================================ */

        :root {
            /* Background colors */
            --bg-primary: #F5F0E8;
            --bg-secondary: #FAF7F2;
            --bg-card: #FFFDF9;
            --bg-dark: #3D4452;

            /* Text colors */
            --text-primary: #3D4452;
            --text-secondary: #5C6370;
            --text-muted: #8B9099;
            --text-light: #F0E6D8;

            /* Border colors */
            --border: #E5DED4;
            --border-light: #F0EBE3;

            /* Brand colors */
            --primary: #C04C4C;
            --primary-hover: #A43E3E;
            --primary-light: #F2DEDE;

            --secondary: #D4764A;
            --secondary-hover: #BF6940;
            --secondary-light: #F8EAE2;

            --accent: #D4A84B;
            --accent-hover: #C49A3D;
            --accent-light: #F8F0DC;

            --teal: #7BA8A8;
            --teal-hover: #6B9898;
            --teal-light: #E8F0F0;

            --cream: #F0E6D8;
            --coffee: #3D2E24;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(61, 68, 82, 0.04);
            --shadow-md: 0 4px 12px rgba(61, 68, 82, 0.08);
            --shadow-lg: 0 8px 24px rgba(61, 68, 82, 0.12);
            --shadow-hover: 0 12px 32px rgba(61, 68, 82, 0.16);

            /* Border radius */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
            --transition-slow: 300ms ease;

            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --tracking-tight: -0.02em;
            --tracking-normal: 0;
            --tracking-wide: 0.05em;
            --tracking-wider: 0.1em;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Site Header */
        .site-header {
            background: #2B323B;
            padding: 1.5rem 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-brand a {
            text-decoration: none;
        }

        .header-logo img {
            height: 100px;
            width: auto;
        }

        .header-text h1 {
            color: var(--cream);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: var(--tracking-tight);
            margin-bottom: 0.25rem;
        }

        .header-text p {
            color: rgba(240, 230, 216, 0.65);
            font-size: 0.85rem;
            max-width: 320px;
            line-height: 1.4;
        }

        .header-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .header-nav a {
            color: rgba(240, 230, 216, 0.7);
            font-size: 0.875rem;
            font-weight: 500;
            transition: color var(--transition-base);
            text-decoration: none;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: var(--cream);
        }

        .header-nav .nav-instagram {
            color: var(--cream);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .header-nav .nav-instagram i {
            font-size: 1.1rem;
        }

        /* Filters */
        .filters-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .filters-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: var(--tracking-wider);
            margin-bottom: 1rem;
            display: block;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.625rem;
        }

        .filter-btn {
            padding: 0.625rem 1.125rem;
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            background: var(--secondary-light);
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        /* Results count */
        .results-count {
            max-width: 800px;
            margin: 0 auto;
            padding: 0.75rem 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: var(--tracking-wide);
        }

        /* Cafes List */
        .cafes-list {
            max-width: 800px;
            margin: 0 auto;
            padding: 0.5rem 2rem 4rem;
        }

        .cafe-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .cafe-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--secondary);
        }

        .cafe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .cafe-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: var(--tracking-tight);
        }

        .cafe-city {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.375rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .cafe-city i {
            color: var(--secondary);
            font-size: 0.8rem;
        }

        .cafe-instagram {
            color: var(--primary);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            white-space: nowrap;
            transition: all var(--transition-base);
        }

        .cafe-instagram:hover {
            color: var(--primary-hover);
        }

        .cafe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: var(--bg-primary);
            color: var(--text-secondary);
            padding: 0.3rem 0.625rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: var(--tracking-wide);
            border: 1px solid var(--border-light);
        }

        /* Country-specific tag colors */
        .tag.argentina {
            background: var(--teal-light);
            color: var(--teal-hover);
            border-color: var(--teal);
        }

        .tag.espana {
            background: var(--secondary-light);
            color: var(--secondary);
            border-color: var(--secondary);
        }

        .tag.brasil {
            background: var(--accent-light);
            color: var(--accent-hover);
            border-color: var(--accent);
        }

        .tag.chile {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-primary);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.75rem;
        }

        .no-results p {
            font-size: 1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            letter-spacing: var(--tracking-wide);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .site-header {
                padding: 0.875rem 1rem;
            }

            .header-top {
                flex-direction: row;
                justify-content: center;
            }

            .header-brand {
                gap: 1rem;
            }

            .header-logo img {
                height: 80px;
                margin-left: -1rem;
            }

            .header-text h1 {
                font-size: 0.95rem;
                margin-bottom: 0.125rem;
            }

            .header-text p {
                display: none;
            }

            .header-text .mobile-instagram {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                color: var(--cream);
                font-size: 0.8rem;
                text-decoration: none;
            }

            .header-text .mobile-instagram i {
                font-size: 0.9rem;
            }

            .header-nav {
                display: none;
            }

            .filters-section {
                padding: 1rem 1.5rem;
            }

            .cafes-list {
                padding: 0.5rem 1.5rem 3rem;
            }

            .cafe-header {
                flex-direction: column;
                gap: 0.625rem;
            }

            .cafe-card {
                padding: 1.25rem;
            }
        }

        @media (min-width: 769px) {
            .header-text .mobile-instagram {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <div class="header-brand">
                <a href="index.html" class="header-logo">
                    <img src="logo-transparent.png" alt="cafes.uy">
                </a>
                <div class="header-text">
                    <h1>Descubrí los mejores cafés</h1>
                    <p>Tu guía para encontrar cafeterías con el mejor café de especialidad, ambiente y cosas ricas.</p>
                    <a href="https://instagram.com/cafes.uy" target="_blank" class="mobile-instagram">
                        <i class="fab fa-instagram"></i> @cafes.uy
                    </a>
                </div>
            </div>
            <nav class="header-nav">
                <a href="cafes.html">Montevideo</a>
                <a href="internacional.html" class="active">Internacional</a>
                <a href="https://instagram.com/cafes.uy" target="_blank" class="nav-instagram">
                    <i class="fab fa-instagram"></i> @cafes.uy
                </a>
            </nav>
        </div>
    </header>

    <main>

        <section class="filters-section">
            <span class="filters-label">Filtrar por país</span>
            <div class="filters">
                <button class="filter-btn" data-country="argentina">
                    Argentina
                </button>
                <button class="filter-btn" data-country="espana">
                    España
                </button>
                <button class="filter-btn" data-country="brasil">
                    Brasil
                </button>
                <button class="filter-btn" data-country="chile">
                    Chile
                </button>
            </div>
        </section>

        <div class="results-count" id="results-count"></div>

        <section class="cafes-list" id="cafes-list">
            <!-- Cafés loaded dynamically -->
        </section>
    </main>

    <footer>
        <p>Hecho con cafe en Uruguay</p>
    </footer>

    <script>
        let allCafes = [];
        let activeCountry = null;

        async function loadCafes() {
            try {
                const response = await fetch('internacional.json');
                const data = await response.json();
                allCafes = data.coffee_shops;
                return allCafes;
            } catch (error) {
                console.error('Error cargando cafés:', error);
                document.getElementById('cafes-list').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fas fa-mug-hot"></i>
                        </div>
                        <p>Error cargando los cafés</p>
                    </div>
                `;
                return [];
            }
        }

        function renderCafes(cafes) {
            const container = document.getElementById('cafes-list');
            const countEl = document.getElementById('results-count');

            if (cafes.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fas fa-globe-americas"></i>
                        </div>
                        <p>No hay cafés agregados en este país todavía</p>
                    </div>
                `;
                countEl.textContent = '0 cafés encontrados';
                return;
            }

            countEl.textContent = `${cafes.length} café${cafes.length !== 1 ? 's' : ''} encontrado${cafes.length !== 1 ? 's' : ''}`;

            container.innerHTML = cafes.map(cafe => `
                <div class="cafe-card" onclick="window.open('https://instagram.com/${cafe.instagram}', '_blank')">
                    <div class="cafe-header">
                        <div>
                            <div class="cafe-name">${cafe.name}</div>
                            ${cafe.city ? `<div class="cafe-city"><i class="fas fa-map-marker-alt"></i> ${cafe.city}</div>` : ''}
                        </div>
                        <a href="https://instagram.com/${cafe.instagram}" target="_blank" class="cafe-instagram" onclick="event.stopPropagation()">
                            <i class="fab fa-instagram"></i> @${cafe.instagram}
                        </a>
                    </div>
                    <div class="cafe-tags">
                        <span class="tag ${cafe.country}">${formatCountry(cafe.country)}</span>
                    </div>
                </div>
            `).join('');
        }

        function formatCountry(country) {
            const countryNames = {
                'argentina': 'Argentina',
                'espana': 'España',
                'brasil': 'Brasil',
                'chile': 'Chile'
            };
            return countryNames[country] || country;
        }

        function filterCafes() {
            if (!activeCountry) {
                renderCafes(allCafes);
                return;
            }

            const filtered = allCafes.filter(cafe => cafe.country === activeCountry);
            renderCafes(filtered);
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const country = btn.dataset.country;

                    if (activeCountry === country) {
                        activeCountry = null;
                        btn.classList.remove('active');
                    } else {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        activeCountry = country;
                        btn.classList.add('active');
                    }

                    filterCafes();
                });
            });
        }

        function getCountryFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('country');
        }

        function activateFilterFromURL() {
            const country = getCountryFromURL();
            if (country) {
                const btn = document.querySelector(`.filter-btn[data-country="${country}"]`);
                if (btn) {
                    activeCountry = country;
                    btn.classList.add('active');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setupFilters();
            activateFilterFromURL();
            await loadCafes();
            if (activeCountry) {
                filterCafes();
            } else {
                renderCafes(allCafes);
            }
        });
    </script>
</body>
</html>
