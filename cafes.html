<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeterías | cafes.uy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================
           DESIGN SYSTEM - cafes.uy
           ============================================ */

        :root {
            /* Background colors */
            --bg-primary: #F5F0E8;
            --bg-secondary: #FAF7F2;
            --bg-card: #FFFDF9;
            --bg-dark: #3D4452;

            /* Text colors */
            --text-primary: #3D4452;
            --text-secondary: #5C6370;
            --text-muted: #8B9099;
            --text-light: #F0E6D8;

            /* Border colors */
            --border: #E5DED4;
            --border-light: #F0EBE3;

            /* Brand colors */
            --primary: #C04C4C;
            --primary-hover: #A43E3E;
            --primary-light: #F2DEDE;

            --secondary: #D4764A;
            --secondary-hover: #BF6940;
            --secondary-light: #F8EAE2;

            --accent: #D4A84B;
            --accent-hover: #C49A3D;
            --accent-light: #F8F0DC;

            --teal: #7BA8A8;
            --teal-hover: #6B9898;
            --teal-light: #E8F0F0;

            --cream: #F0E6D8;
            --coffee: #3D2E24;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(61, 68, 82, 0.04);
            --shadow-md: 0 4px 12px rgba(61, 68, 82, 0.08);
            --shadow-lg: 0 8px 24px rgba(61, 68, 82, 0.12);
            --shadow-hover: 0 12px 32px rgba(61, 68, 82, 0.16);

            /* Border radius */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
            --transition-slow: 300ms ease;

            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --tracking-tight: -0.02em;
            --tracking-normal: 0;
            --tracking-wide: 0.05em;
            --tracking-wider: 0.1em;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Site Header */
        .site-header {
            background: #2B323B;
            padding: 1.5rem 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-brand a {
            text-decoration: none;
        }

        .header-logo img {
            height: 100px;
            width: auto;
        }

        .header-text h1 {
            color: var(--cream);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: var(--tracking-tight);
            margin-bottom: 0.25rem;
        }

        .header-text p {
            color: rgba(240, 230, 216, 0.65);
            font-size: 0.85rem;
            max-width: 320px;
            line-height: 1.4;
        }

        .header-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .header-nav a {
            color: rgba(240, 230, 216, 0.7);
            font-size: 0.875rem;
            font-weight: 500;
            transition: color var(--transition-base);
            text-decoration: none;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: var(--cream);
        }

        .header-nav .nav-instagram {
            color: var(--cream);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .header-nav .nav-instagram i {
            font-size: 1.1rem;
        }

        /* Filters */
        .filters-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .filters-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: var(--tracking-wider);
            margin-bottom: 1rem;
            display: block;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.625rem;
        }

        .filter-btn {
            padding: 0.625rem 1.125rem;
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            background: var(--secondary-light);
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        .filter-btn i {
            font-size: 0.85rem;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            padding: 0.625rem 1.125rem;
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dropdown-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            background: var(--secondary-light);
        }

        .dropdown-btn.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-top: 0.5rem;
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            z-index: 10;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.875rem 1.125rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: var(--font-sans);
        }

        .dropdown-item:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .dropdown-item.active {
            background: var(--text-primary);
            color: white;
        }

        .dropdown-item#descuentos-todos,
        .dropdown-item#barrio-todos {
            border-bottom: 1px solid var(--border);
        }

        #barrio-dropdown {
            max-height: 300px;
            overflow-y: auto;
        }

        .dropdown-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .bank-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .bank-dot.itau { background: #F47920; }
        .bank-dot.santander { background: #EC0000; }
        .bank-dot.bbva { background: #004481; }
        .bank-dot.scotiabank { background: #B22234; }

        /* Results count */
        .results-count {
            max-width: 800px;
            margin: 0 auto;
            padding: 0.75rem 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: var(--tracking-wide);
        }

        /* Cafes List */
        .cafes-list {
            max-width: 800px;
            margin: 0 auto;
            padding: 0.5rem 2rem 4rem;
        }

        .cafe-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .cafe-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--secondary);
        }

        .cafe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .cafe-main {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .cafe-image {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border-light);
        }

        .cafe-info {
            flex: 1;
        }

        .cafe-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: var(--tracking-tight);
        }

        .cafe-address {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.375rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .cafe-address i {
            color: var(--secondary);
            font-size: 0.8rem;
        }

        .cafe-hours {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .cafe-hours i {
            font-size: 0.75rem;
        }

        .cafe-instagram {
            color: var(--primary);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            white-space: nowrap;
            transition: all var(--transition-base);
        }

        .cafe-instagram:hover {
            color: var(--primary-hover);
        }

        .cafe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: var(--bg-primary);
            color: var(--text-secondary);
            padding: 0.3rem 0.625rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: var(--tracking-wide);
            border: 1px solid var(--border-light);
        }

        .tag.domingos {
            background: var(--teal-light);
            color: var(--teal-hover);
            border-color: var(--teal);
        }

        .tag.descuento-bbva {
            background: #E8F0F8;
            color: #003087;
            border-color: #B8D4F0;
        }

        .tag.descuento-santander {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }

        .tag.descuento-itau {
            background: var(--secondary-light);
            color: var(--secondary);
            border-color: var(--secondary);
        }

        .tag.descuento-scotiabank {
            background: var(--primary-light);
            color: #B22234;
            border-color: #B22234;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-primary);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.75rem;
        }

        .no-results p {
            font-size: 1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            letter-spacing: var(--tracking-wide);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .site-header {
                padding: 0.875rem 1rem;
            }

            .header-top {
                flex-direction: row;
                justify-content: center;
            }

            .header-brand {
                gap: 1rem;
            }

            .header-logo img {
                height: 80px;
                margin-left: -1rem;
            }

            .header-text h1 {
                font-size: 0.95rem;
                margin-bottom: 0.125rem;
            }

            .header-text p {
                display: none;
            }

            .header-text .mobile-instagram {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                color: var(--cream);
                font-size: 0.8rem;
                text-decoration: none;
            }

            .header-text .mobile-instagram i {
                font-size: 0.9rem;
            }

            .header-nav {
                display: none;
            }

            .filters-section {
                padding: 1rem 1.5rem;
            }

            .cafes-list {
                padding: 0.5rem 1.5rem 3rem;
            }

            .cafe-header {
                flex-direction: column;
                gap: 0.625rem;
            }

            .cafe-card {
                padding: 1.25rem;
            }

            .cafe-image {
                width: 48px;
                height: 48px;
            }
        }

        @media (min-width: 769px) {
            .header-text .mobile-instagram {
                display: none;
            }
        }
    </style>
</head>
<body>

                    <img src="logo-transparent.png" alt="cafes.uy">

    <main>

                        <button class="dropdown-item" data-barrio="Carrasco">Carrasco</button>
                        <button class="dropdown-item" data-barrio="Parque Rodó">Parque Rodó</button>
                        <button class="dropdown-item" data-barrio="Parque Batlle">Parque Batlle</button>
                        <button class="dropdown-item" data-barrio="Malvín">Malvín</button>
                        <button class="dropdown-item" data-barrio="Palermo">Palermo</button>

                    <button class="dropdown-btn" id="descuentos-btn">

            <!-- Cafés loaded dynamically -->

    <footer>
        <p>Hecho con cafe en Uruguay</p>
    </footer>

    <script>
        let allCafes = [];
        let activeFilters = new Set();
        let activeDiscountFilter = null;
        let activeBarrioFilter = null;
        let openNowFilter = false;

        async function loadCafes() {
            try {
                const response = await fetch('cafes.json');
                const data = await response.json();
                allCafes = data.coffee_shops;
                return allCafes;
            } catch (error) {
                console.error('Error cargando cafés:', error);
                document.getElementById('cafes-list').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fas fa-mug-hot"></i>
                        </div>
                        <p>Error cargando los cafés</p>
                    </div>
                `;
                return [];
            }
        }

        function renderCafes(cafes) {
            const container = document.getElementById('cafes-list');
            const countEl = document.getElementById('results-count');

            if (cafes.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <p>No encontramos cafés con esos filtros</p>
                    </div>
                `;
                countEl.textContent = '0 cafés encontrados';
                return;
            }

            countEl.textContent = `${cafes.length} café${cafes.length !== 1 ? 's' : ''} encontrado${cafes.length !== 1 ? 's' : ''}`;

            container.innerHTML = cafes.map(cafe => `
                <div class="cafe-card" onclick="window.open('https://instagram.com/${cafe.instagram}', '_blank')">
                    <div class="cafe-header">
                        <div class="cafe-main">
                            ${cafe.image ? `<img src="${cafe.image}" alt="${cafe.name}" class="cafe-image" onerror="this.style.display='none'">` : ''}
                            <div class="cafe-info">
                                <div class="cafe-name">${cafe.name}</div>
                                ${cafe.address ? `<div class="cafe-address"><i class="fas fa-map-marker-alt"></i> ${cafe.address}</div>` : ''}
                                ${cafe.opening_hours ? `<div class="cafe-hours"><i class="far fa-clock"></i> ${cafe.opening_hours}</div>` : ''}
                            </div>
                        </div>
                        <a href="https://instagram.com/${cafe.instagram}" target="_blank" class="cafe-instagram" onclick="event.stopPropagation()">
                            <i class="fab fa-instagram"></i> @${cafe.instagram}
                        </a>
                    </div>
                    ${cafe.tags.length > 0 ? `
                        <div class="cafe-tags">
                            ${cafe.tags.map(tag => `<span class="tag ${tag}">${formatTag(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function formatTag(tag) {
            const tagNames = {
                'domingos': 'Domingos',
                'opcion-celiaco': 'Celíaco',
                'opcion-vegano': 'Vegano',
                'pet-friendly': 'Pet friendly',
                'wifi': 'WiFi',
                'enchufes': 'Enchufes',
                'descuento-bbva': 'BBVA',
                'descuento-santander': 'Santander',
                'descuento-itau': 'Itaú',
                'descuento-scotiabank': 'Scotiabank'
            };
            return tagNames[tag] || tag;
        }

        function getBarrioFromAddress(address) {
            if (!address) return null;
            const parts = address.split(',').map(p => p.trim());
            // El barrio está en la segunda posición (índice 1)
            return parts.length > 1 ? parts[1] : null;
        }

        function isOpenNow(cafe) {
            if (!cafe.hours_data) return false;

            const now = new Date();
            const days = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
            const today = days[now.getDay()];

            const todayHours = cafe.hours_data[today];
            if (!todayHours) return false;

            const [openTime, closeTime] = todayHours.split('-');
            const [openH, openM] = openTime.split(':').map(Number);
            const [closeH, closeM] = closeTime.split(':').map(Number);

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const openMinutes = openH * 60 + openM;
            let closeMinutes = closeH * 60 + closeM;

            // Si cierra después de medianoche (ej: 00:00, 01:00, 02:00)
            if (closeMinutes < openMinutes) {
                closeMinutes += 24 * 60;
            }

            return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
        }

        function filterCafes() {
            let filtered = allCafes;

            if (openNowFilter) {
                filtered = filtered.filter(cafe => isOpenNow(cafe));
            }

            if (activeFilters.size > 0) {
                filtered = filtered.filter(cafe => {
                    return [...activeFilters].every(filter => cafe.tags.includes(filter));
                });
            }

            if (activeDiscountFilter) {
                filtered = filtered.filter(cafe => cafe.tags.includes(activeDiscountFilter));
            }

            if (activeBarrioFilter) {
                filtered = filtered.filter(cafe => {
                    const barrio = getBarrioFromAddress(cafe.address);
                    return barrio && barrio.toLowerCase().includes(activeBarrioFilter.toLowerCase());
                });
            }

            renderCafes(filtered);
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn[data-tag]');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tag = btn.dataset.tag;

                    if (activeFilters.has(tag)) {
                        activeFilters.delete(tag);
                        btn.classList.remove('active');
                    } else {
                        activeFilters.add(tag);
                        btn.classList.add('active');
                    }

                    filterCafes();
                });
            });
        }

        function setupOpenNowFilter() {
            const btn = document.getElementById('open-now-btn');
            btn.addEventListener('click', () => {
                openNowFilter = !openNowFilter;
                btn.classList.toggle('active', openNowFilter);
                filterCafes();
            });
        }

        function setupDiscountDropdown() {
            const dropdownBtn = document.getElementById('descuentos-btn');
            const dropdown = document.getElementById('descuentos-dropdown');
            const dropdownItems = dropdown.querySelectorAll('.dropdown-item');

            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('barrio-dropdown').classList.remove('show');
                dropdown.classList.toggle('show');
            });

            dropdownItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tag = item.dataset.tag;

                    if (tag === 'todos') {
                        activeDiscountFilter = null;
                        dropdownItems.forEach(i => i.classList.remove('active'));
                        dropdownBtn.classList.remove('active');
                    }
                    else if (activeDiscountFilter === tag) {
                        activeDiscountFilter = null;
                        item.classList.remove('active');
                        dropdownBtn.classList.remove('active');
                    } else {
                        dropdownItems.forEach(i => i.classList.remove('active'));
                        activeDiscountFilter = tag;
                        item.classList.add('active');
                        dropdownBtn.classList.add('active');
                    }

                    dropdown.classList.remove('show');
                    filterCafes();
                });
            });
        }

        function setupBarrioDropdown() {
            const dropdownBtn = document.getElementById('barrio-btn');
            const dropdown = document.getElementById('barrio-dropdown');
            const dropdownItems = dropdown.querySelectorAll('.dropdown-item');

            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('descuentos-dropdown').classList.remove('show');
                dropdown.classList.toggle('show');
            });

            dropdownItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const barrio = item.dataset.barrio;

                    if (barrio === 'todos') {
                        activeBarrioFilter = null;
                        dropdownItems.forEach(i => i.classList.remove('active'));
                        dropdownBtn.classList.remove('active');
                        dropdownBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Barrio <i class="fas fa-chevron-down" style="font-size: 0.65rem; margin-left: 0.25rem;"></i>';
                    }
                    else if (activeBarrioFilter === barrio) {
                        activeBarrioFilter = null;
                        item.classList.remove('active');
                        dropdownBtn.classList.remove('active');
                        dropdownBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Barrio <i class="fas fa-chevron-down" style="font-size: 0.65rem; margin-left: 0.25rem;"></i>';
                    } else {
                        dropdownItems.forEach(i => i.classList.remove('active'));
                        activeBarrioFilter = barrio;
                        item.classList.add('active');
                        dropdownBtn.classList.add('active');
                        dropdownBtn.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${barrio} <i class="fas fa-chevron-down" style="font-size: 0.65rem; margin-left: 0.25rem;"></i>`;
                    }

                    dropdown.classList.remove('show');
                    filterCafes();
                });
            });
        }

        document.addEventListener('click', () => {
            document.getElementById('descuentos-dropdown').classList.remove('show');
            document.getElementById('barrio-dropdown').classList.remove('show');
        });

        function getFilterFromURL() {
            const params = new URLSearchParams(window.location.search);
            return {
                filter: params.get('filter'),
                barrio: params.get('barrio')
            };
        }

        function activateFilterFromURL() {
            const { filter, barrio } = getFilterFromURL();

            if (filter) {
                if (filter.startsWith('descuento-')) {
                    const item = document.querySelector(`.dropdown-item[data-tag="${filter}"]`);
                    if (item) {
                        activeDiscountFilter = filter;
                        item.classList.add('active');
                        document.getElementById('descuentos-btn').classList.add('active');
                    }
                } else {
                    const btn = document.querySelector(`.filter-btn[data-tag="${filter}"]`);
                    if (btn) {
                        activeFilters.add(filter);
                        btn.classList.add('active');
                    }
                }
            }

            if (barrio) {
                const item = document.querySelector(`.dropdown-item[data-barrio="${barrio}"]`);
                if (item) {
                    activeBarrioFilter = barrio;
                    item.classList.add('active');
                    const barrioBtn = document.getElementById('barrio-btn');
                    barrioBtn.classList.add('active');
                    barrioBtn.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${barrio} <i class="fas fa-chevron-down" style="font-size: 0.65rem; margin-left: 0.25rem;"></i>`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setupFilters();
            setupOpenNowFilter();
            setupDiscountDropdown();
            setupBarrioDropdown();
            activateFilterFromURL();
            await loadCafes();
            if (activeFilters.size > 0 || activeDiscountFilter || activeBarrioFilter || openNowFilter) {
                filterCafes();
            } else {
                renderCafes(allCafes);
            }
        });
    </script>
</body>
</html>
